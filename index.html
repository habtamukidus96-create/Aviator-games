<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sports Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-24 font-sans selection:bg-yellow-400 selection:text-black">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-yellow-500 text-xl font-black tracking-wider uppercase">Addis<span class="text-white bg-yellow-500 px-1 rounded-sm ml-1 text-gray-950">Bet</span></span>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 flex items-center gap-1.5">
                <i class="fa-solid fa-wallet text-yellow-500 text-xs"></i>
                <span id="walletBalance" class="text-sm font-bold tracking-wide text-gray-200">ETB 0.00</span>
            </div>
            <button class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold px-4 py-1.5 rounded-lg text-sm transition-all duration-200 shadow-md">Join</button>
        </div>
    </header>

    <main class="p-3 max-w-md mx-auto space-y-4">
        
        <div class="flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                </span>
                <h2 class="text-sm font-bold tracking-wider uppercase text-gray-400">Live Football Matches</h2>
            </div>
            <span class="text-xs text-yellow-500 font-semibold cursor-pointer hover:underline">View All</span>
        </div>

        <div class="bg-gray-900 rounded-xl border border-gray-800 shadow-xl overflow-hidden">
            <div class="bg-gray-850 px-3 py-1.5 border-b border-gray-800/50 flex justify-between items-center text-xs text-gray-400 font-medium">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-trophy text-yellow-600"></i> Premier League</span>
                <span class="text-red-400 font-semibold bg-red-500/10 px-1.5 py-0.5 rounded-sm">73' Live</span>
            </div>
            
            <div class="p-4 flex justify-between items-center gap-2">
                <div class="space-y-2 flex-1">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-200 text-sm tracking-wide">Manchester City</span>
                        <span class="font-black text-yellow-500 text-base">2</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-gray-200 text-sm tracking-wide">Arsenal FC</span>
                        <span class="font-black text-yellow-500 text-base">1</span>
                    </div>
                </div>
            </div>

            <div class="px-3 pb-4 grid grid-cols-3 gap-2">
                <button onclick="toggleSelection(this, 'Manchester City', '2.10')" class="bg-gray-800 hover:bg-gray-700/80 active:scale-98 border border-gray-700/60 rounded-xl p-2.5 flex flex-col items-center justify-center transition-all duration-150 group">
                    <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-gray-400 mb-0.5">1</span>
                    <span class="font-black text-sm text-yellow-500">2.10</span>
                </button>
                <button onclick="toggleSelection(this, 'Draw', '3.40')" class="bg-gray-800 hover:bg-gray-700/80 active:scale-98 border border-gray-700/60 rounded-xl p-2.5 flex flex-col items-center justify-center transition-all duration-150 group">
                    <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-gray-400 mb-0.5">X</span>
                    <span class="font-black text-sm text-yellow-500">3.40</span>
                </button>
                <button onclick="toggleSelection(this, 'Arsenal FC', '4.20')" class="bg-gray-800 hover:bg-gray-700/80 active:scale-98 border border-gray-700/60 rounded-xl p-2.5 flex flex-col items-center justify-center transition-all duration-150 group">
                    <span class="text-[10px] uppercase font-bold text-gray-500 group-hover:text-gray-400 mb-0.5">2</span>
                    <span class="font-black text-sm text-yellow-500">4.20</span>
                </button>
            </div>
        </div>
    </main>

    <div id="betSlip" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-900 border-t border-gray-800 px-4 py-3 transform translate-y-full transition-transform duration-350 ease-out z-50 rounded-t-2xl shadow-2xl">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <span class="bg-yellow-500 text-gray-950 text-xs font-black px-1.5 py-0.5 rounded-full" id="slipCount">1</span>
                <h3 class="font-bold text-sm tracking-wide text-gray-200">Bet Slip</h3>
            </div>
            <button onclick="clearSlip()" class="text-xs text-gray-500 hover:text-red-400 transition-colors"><i class="fa-solid fa-trash-can mr-1"></i> Clear</button>
        </div>
        
        <div class="bg-gray-800/50 border border-gray-700/40 rounded-xl p-3 mb-4 flex justify-between items-center">
            <div>
                <p class="text-xs font-bold text-gray-400" id="slipSelection">Selection: None</p>
                <p class="text-[10px] text-gray-500 mt-0.5">Match Odds (1X2)</p>
            </div>
            <span class="font-black text-yellow-500 text-sm" id="slipOdds">0.00</span>
        </div>

        <div class="grid grid-cols-2 gap-3 items-center mb-3">
            <div class="relative">
                <span class="absolute left-3 top-2.5 text-xs font-bold text-gray-500">ETB</span>
                <input type="number" id="stakeInput" value="50" oninput="calculateReturn()" class="w-full bg-gray-950 border border-gray-700 rounded-xl py-2 pl-10 pr-3 text-sm font-bold text-white focus:outline-none focus:border-yellow-500 transition-colors">
            </div>
            <div class="text-right">
                <p class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Est. Return</p>
                <p class="text-base font-black text-emerald-400" id="estReturn">ETB 0.00</p>
            </div>
        </div>

        <button onclick="submitBet()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black py-3 rounded-xl text-sm transition-all shadow-md tracking-wider uppercase">Place Bet</button>
    </div>

    <script>
        let currentSelection = null;
        // Points directly to the current origin domain dynamically
        const API_URL = window.location.origin; 

        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_URL}/api/user/profile`);
                const data = await response.json();
                document.getElementById('walletBalance').innerText = `${data.currency} ${data.balance.toFixed(2)}`;
            } catch (err) {
                console.error("Error updating user wallet profile component:", err);
            }
        }

        function toggleSelection(btn, pick, odds) {
            document.querySelectorAll('main button').forEach(b => b.classList.remove('border-yellow-500', 'bg-yellow-500/10'));
            
            if (currentSelection === pick) {
                currentSelection = null;
                document.getElementById('betSlip').classList.add('translate-y-full');
            } else {
                currentSelection = pick;
                btn.classList.add('border-yellow-500', 'bg-yellow-500/10');
                
                document.getElementById('slipSelection').innerText = `Selection: ${pick}`;
                document.getElementById('slipOdds').innerText = odds;
                document.getElementById('betSlip').classList.remove('translate-y-full');
                calculateReturn();
            }
        }

        function calculateReturn() {
            const stake = parseFloat(document.getElementById('stakeInput').value) || 0;
            const odds = parseFloat(document.getElementById('slipOdds').innerText) || 0;
            document.getElementById('estReturn').innerText = `ETB ${(stake * odds).toFixed(2)}`;
        }

        function clearSlip() {
            currentSelection = null;
            document.querySelectorAll('main button').forEach(b => b.classList.remove('border-yellow-500', 'bg-yellow-500/10'));
            document.getElementById('betSlip').classList.add('translate-y-full');
        }

        async function submitBet() {
            if (!currentSelection) return;

            const odds = document.getElementById('slipOdds').innerText;
            const stake = document.getElementById('stakeInput').value;

            try {
                const response = await fetch(`${API_URL}/api/bets/place`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        selection: currentSelection,
                        odds: odds,
                        stake: stake
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`🎉 ${result.message}\nBet ID: ${result.betId}`);
                    document.getElementById('walletBalance').innerText = `ETB ${result.newBalance.toFixed(2)}`;
                    clearSlip();
                } else {
                    alert(`⚠️ Bet Rejected: ${result.message}`);
                }
            } catch (err) {
                alert("Network communication issue while submitting selection.");
                console.error(err);
            }
        }

        window.onload = loadUserProfile;
    </script>
</body>
</html>
