<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YAZEW BET - Premium Aviator</title>
    <style>
        :root {
            --gold: #f1c40f;
            --deep-bg: #0a0b0d;
            --panel-bg: #1a1c23;
            --glass: rgba(255, 255, 255, 0.05);
            --luxury-green: linear-gradient(180deg, #91d11a 0%, #5d8a11 100%);
            --luxury-orange: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
        }

        body {
            background-color: var(--deep-bg);
            color: white;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #12141a;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span { color: var(--gold); }

        .deposit-btn {
            background: #27ae60;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Balance Section */
        .wallet-row {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181a21;
        }

        .balance-info p { margin: 0; font-size: 0.8rem; color: #888; }
        .balance-info h4 { margin: 0; font-size: 1.1rem; color: var(--gold); }

        /* LUXURY FLIGHT AREA */
        .sky-container {
            position: relative;
            height: 280px;
            margin: 10px;
            border-radius: 15px;
            background: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .sky-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.4) 100%);
        }

        .multiplier-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0px 0px 30px rgba(0,0,0,1);
            transition: color 0.3s;
        }

        .plane {
            position: absolute;
            width: 120px; /* Increased size */
            height: auto;
            bottom: 20px;
            left: 10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.1s linear;
            z-index: 5;
            opacity: 0;
        }

        /* History Ribbon */
        .history {
            display: flex;
            gap: 8px;
            padding: 5px 15px;
            overflow-x: auto;
            font-size: 0.7rem;
        }

        .history span {
            background: #23262e;
            padding: 3px 10px;
            border-radius: 10px;
            color: #4fa0ff;
            font-weight: bold;
        }

        /* BETTER BETTING PANELS */
        .bet-section {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-card {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #2c2f3a;
        }

        .input-row {
            display: flex;
            gap: 10px;
            height: 90px;
        }

        .controls-left { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        .stepper {
            background: #111;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #333;
        }

        .stepper input {
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            width: 60px;
            font-size: 1rem;
            font-weight: bold;
        }

        .stepper button {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            padding: 0 10px;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .quick-amounts button {
            background: #282a34;
            border: none;
            color: white;
            border-radius: 5px;
            padding: 5px 0;
            font-size: 0.7rem;
        }

        .bet-btn {
            flex: 1;
            border-radius: 12px;
            border: none;
            background: var(--luxury-green);
            color: white;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #3e5c0b;
            cursor: pointer;
        }

        .bet-btn span { display: block; font-size: 0.8rem; font-weight: 400; }

        .cashout { background: var(--luxury-orange); box-shadow: 0 4px 0 #a04000; }

        .auto-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">Yazew<span> Bet</span></div>
        <button class="deposit-btn">Deposit</button>
    </header>

    <div class="wallet-row">
        <div class="balance-info">
            <p>Balance</p>
            <h4 id="balance">500,000.00 FUN</h4>
        </div>
        <button style="background:transparent; border:1px solid #555; color:white; padding:5px 10px; border-radius:5px; font-size:0.7rem;">PLAY FOR REAL</button>
    </div>

    <div class="history">
        <span>1.52x</span><span>4.10x</span><span>1.12x</span><span>2.88x</span><span>10.4x</span>
    </div>

    <div class="sky-container">
        <div class="sky-overlay"></div>
        <div class="multiplier-display" id="mult-text">1.00x</div>
        <img src="https://i.ibb.co/m0vBvXj/pngegg.png" class="plane" id="plane-img" alt="Plane">
    </div>

    <div class="bet-section">
        <div class="bet-card">
            <div class="input-row">
                <div class="controls-left">
                    <div class="stepper">
                        <button onclick="changeBet(1, -1)">-</button>
                        <input type="number" id="amt-1" value="10.00">
                        <button onclick="changeBet(1, 1)">+</button>
                    </div>
                    <div class="quick-amounts">
                        <button onclick="setBet(1, 1)">1</button>
                        <button onclick="setBet(1, 10)">10</button>
                        <button onclick="setBet(1, 25)">25</button>
                        <button onclick="setBet(1, 50)">50</button>
                    </div>
                </div>
                <button class="bet-btn" id="btn-1" onclick="placeBet(1)">BET<span id="label-1">10.00 FUN</span></button>
            </div>
            <div class="auto-row">Auto Cashout <input type="checkbox"></div>
        </div>

        <div class="bet-card">
            <div class="input-row">
                <div class="controls-left">
                    <div class="stepper">
                        <button onclick="changeBet(2, -1)">-</button>
                        <input type="number" id="amt-2" value="10.00">
                        <button onclick="changeBet(2, 1)">+</button>
                    </div>
                    <div class="quick-amounts">
                        <button onclick="setBet(2, 1)">1</button>
                        <button onclick="setBet(2, 10)">10</button>
                        <button onclick="setBet(2, 25)">25</button>
                        <button onclick="setBet(2, 50)">50</button>
                    </div>
                </div>
                <button class="bet-btn" id="btn-2" onclick="placeBet(2)">BET<span id="label-2">10.00 FUN</span></button>
            </div>
            <div class="auto-row">Auto Cashout <input type="checkbox"></div>
        </div>
    </div>
</div>

<script>
    let balance = 500000;
    let multiplier = 1.0;
    let isFlying = false;
    let crashPoint = 0;
    let gameLoop;
    let bets = { 1: { active: false, amt: 0 }, 2: { active: false, amt: 0 } };

    const multText = document.getElementById('mult-text');
    const planeImg = document.getElementById('plane-img');

    function setBet(p, val) { document.getElementById('amt-'+p).value = val.toFixed(2); updateLabels(); }
    function changeBet(p, val) { 
        let el = document.getElementById('amt-'+p);
        el.value = (parseFloat(el.value) + val).toFixed(2);
        updateLabels();
    }
    function updateLabels() {
        if(!bets[1].active) document.getElementById('label-1').innerText = document.getElementById('amt-1').value + " FUN";
        if(!bets[2].active) document.getElementById('label-2').innerText = document.getElementById('amt-2').value + " FUN";
    }

    function placeBet(p) {
        if (!isFlying && !bets[p].active) {
            let val = parseFloat(document.getElementById('amt-'+p).value);
            balance -= val;
            bets[p].active = true;
            bets[p].amt = val;
            document.getElementById('btn-'+p).innerText = "WAITING...";
            document.getElementById('btn-'+p).classList.add('cashout'); // visually change
            document.getElementById('balance').innerText = balance.toLocaleString() + ".00 FUN";
            if (!isFlying) startEngine();
        } else if (isFlying && bets[p].active) {
            cashOut(p);
        }
    }

    function cashOut(p) {
        let win = bets[p].amt * multiplier;
        balance += win;
        bets[p].active = false;
        document.getElementById('btn-'+p).innerText = "BET";
        document.getElementById('btn-'+p).classList.remove('cashout');
        document.getElementById('balance').innerText = balance.toLocaleString() + ".00 FUN";
        updateLabels();
    }

    function startEngine() {
        if (isFlying) return;
        isFlying = true;
        multiplier = 1.0;
        crashPoint = 1.1 + Math.random() * 5; // Simple crash logic
        planeImg.style.opacity = 1;
        
        let start = Date.now();
        gameLoop = setInterval(() => {
            let elapsed = (Date.now() - start) / 1000;
            multiplier = Math.pow(1.1, elapsed * 2);
            multText.innerText = multiplier.toFixed(2) + "x";
            multText.style.color = "white";

            // Luxury Plane movement
            let x = Math.min(elapsed * 40, 250);
            let y = Math.min(elapsed * -15, -150);
            planeImg.style.transform = `translate(${x}px, ${y}px)`;

            // Update Cashout labels
            if(bets[1].active) document.getElementById('btn-1').innerHTML = `CASHOUT <span>${(bets[1].amt * multiplier).toFixed(2)}</span>`;
            if(bets[2].active) document.getElementById('btn-2').innerHTML = `CASHOUT <span>${(bets[2].amt * multiplier).toFixed(2)}</span>`;

            if (multiplier >= crashPoint) {
                clearInterval(gameLoop);
                crash();
            }
        }, 50);
    }

    function crash() {
        multText.innerText = "FLEW AWAY!";
        multText.style.color = "#e74c3c";
        planeImg.style.opacity = 0;
        isFlying = false;
        bets[1].active = false;
        bets[2].active = false;
        setTimeout(() => {
            multText.innerText = "1.00x";
            document.getElementById('btn-1').classList.remove('cashout');
            document.getElementById('btn-1').innerText = "BET";
            document.getElementById('btn-2').classList.remove('cashout');
            document.getElementById('btn-2').innerText = "BET";
            updateLabels();
        }, 3000);
    }
</script>
</body>
</html>
