<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YAZEW BET - High-End Aviator</title>
    <style>
        :root {
            --gold: #f1c40f;
            --deep-bg: #030405; /* Deeper dark background */
            --luxury-green: linear-gradient(180deg, #7ad316 0%, #3e5a0b 100%);
            --crashed-red: #e74c3c;
        }

        body {
            background-color: var(--deep-bg);
            color: white;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Locked to mobile width */
            background-color: var(--deep-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header (Matching image) */
        header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101217;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }
        .logo span { color: var(--gold); }

        .deposit-btn {
            background: #27ae60;
            border: none;
            color: white;
            padding: 7px 16px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Balance Section (Matching image) */
        .status-row {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181a1f;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #34495e; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .balance-info p { margin: 0; font-size: 0.75rem; color: #aaa; }
        .balance-info h4 { margin: 0; font-size: 1rem; color: var(--gold); }
        .play-real-btn { background: transparent; border: 1px solid #555; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }

        /* History Ribbon */
        .history-ribbon {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            overflow-x: auto;
            background: #101217;
        }
        .history-tag { font-size: 0.75rem; color: #4fa0ff; font-weight: bold; background: #1c1f26; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }

        /* MAIN PLANE FLIGHT AREA (Matching Image Visuals) */
        .theater-container {
            position: relative;
            height: 240px;
            margin: 10px 16px;
            border-radius: 12px;
            /* Using a simple night gradient that matches the screenshot aesthetic */
            background: linear-gradient(180deg, #1f2b3e 0%, #11141a 100%);
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        .multiplier-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.8rem;
            font-weight: 900;
            color: white;
            z-index: 10;
            text-shadow: 0 0 30px rgba(0,0,0,1);
            transition: color 0.3s;
        }
        .multiplier-text.crashed { color: var(--crashed-red); text-shadow: 0 0 10px var(--crashed-red); }

        /* THE PLANE (SVG Embedded directly so it always appears) */
        .plane-wrapper {
            position: absolute;
            width: 80px; /* Larger plane for luxurious feel */
            height: auto;
            bottom: 30px;
            left: 30px;
            z-index: 5;
            opacity: 0; /* Starts hidden */
            transition: transform 0.1s linear, opacity 0.3s;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }

        .meta-data { position: absolute; bottom: 8px; width: 100%; padding: 0 12px; display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255,255,255,0.4); z-index: 8; box-sizing: border-box; }

        /* BETTING PANELS: UPGRADED TO MATCHING DARK WOOD PANELS */
        .bet-engine {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .bet-card {
            background-color: #1a1d24; /* Base dark color */
            /* High-End Dark Wood Background Texture applied via CSS Gradient */
            background-image: 
                linear-gradient(rgba(26, 29, 36, 0.9), rgba(15, 17, 21, 0.95)),
                repeating-linear-gradient(60deg, transparent, transparent 10px, rgba(20, 20, 20, 0.3) 10px, rgba(20, 20, 20, 0.3) 20px),
                linear-gradient(to right, #2c1a11, #1a1d24 50%, #2c1a11);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #23252d;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .bet-interface { display: flex; gap: 12px; }
        .controls-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }

        /* Stepper (Matching image style) */
        .wager-stepper {
            background: #131417;
            display: flex;
            align-items: center;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid #2c2e38;
        }
        .wager-stepper button { background: none; border: none; color: white; font-weight: bold; font-size: 1.2rem; padding: 0 12px; cursor: pointer; }
        .wager-stepper input { flex: 1; background: transparent; border: none; color: white; text-align: center; font-size: 1rem; font-weight: bold; width: 50px; outline: none; }

        /* Pre-set tokens (Matching image style) */
        .quick-wager-tokens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .token-btn { background: #282a34; border: none; color: #ddd; border-radius: 6px; padding: 6px 0; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

        /* Main BET Button (Matching Image style/gradient) */
        .bet-submit-btn {
            flex: 1;
            border-radius: 10px;
            border: none;
            background: var(--luxury-green);
            color: white;
            font-weight: 800;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s;
        }
        .bet-submit-btn span { font-size: 0.75rem; font-weight: normal; margin-top: 2px; }
        .bet-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Toggle switches */
        .options-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #aaa; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(16px); }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">YAZEW<span> BET</span></div>
        <button class="deposit-btn">Deposit</button>
    </header>

    <div class="status-row">
        <div class="user-info">
            <div class="avatar">👤</div>
            <div class="balance-info">
                <p>Balance</p>
                <h4 id="wallet-amt">500,000.00 FUN</h4>
            </div>
        </div>
        <button class="play-real-btn">PLAY FOR REAL</button>
    </div>

    <div class="history-ribbon">
        <span class="history-tag">1.25x</span><span class="history-tag">4.01x</span><span class="history-tag">1.03x</span><span class="history-tag">2.11x</span><span class="history-tag">8.99x</span>
    </div>

    <div class="theater-container">
        <div class="multiplier-text" id="flight-mult">1.00x</div>
        
        <!-- PLANE SVG EMBEDDED DIRECTLY - GUARANTEED TO WORK -->
        <div class="plane-wrapper" id="the-plane">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M58 28.5L42.5 19H34.5L40 28.5H16L10 20.5H5V36.5H10L16 28.5H58" fill="white" stroke="white" stroke-width="1"/>
                <path d="M34.5 19L31.5 15.5L34.5 12H42.5L39.5 15.5L42.5 19H34.5Z" fill="#e74c3c" stroke="white" stroke-width="1"/>
                <circle cx="3" cy="28.5" r="3" fill="#e74c3c" stroke="white" stroke-width="1"/>
            </svg>
        </div>

        <div class="meta-data">
            <span>👤 52 Players</span>
            <span>Round ID: 6381816</span>
        </div>
    </div>

    <div class="bet-engine">
        
        <!-- Panel 1 (Upgraded Wood Panel) -->
        <div class="bet-card">
            <div class="bet-interface">
                <div class="controls-col">
                    <div class="wager-stepper">
                        <button onclick="changeAmt(1, -0.05)">-</button>
                        <input type="number" id="amt-1" value="0.05" step="0.01">
                        <button onclick="changeAmt(1, 0.05)">+</button>
                    </div>
                    <div class="quick-wager-tokens">
                        <button class="token-btn" onclick="setPreset(1, 1)">1</button>
                        <button class="token-btn" onclick="setPreset(1, 10)">10</button>
                        <button class="token-btn" onclick="setPreset(1, 25)">25</button>
                        <button class="token-btn" onclick="setPreset(1, 50)">50</button>
                    </div>
                </div>
                <button class="bet-submit-btn" id="btn-1" onclick="handleBet(1)">
                    BET
                    <span id="label-1">0.05 FUN</span>
                </button>
            </div>
            <div class="options-row">
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                <span>Auto Cashout</span>
                <span>Auto Bet <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1V3M5 9V7M1 5H3M9 5H7M2.2 2.2L3.6 3.6M7.8 7.8L6.4 6.4M2.2 7.8L3.6 6.4M7.8 2.2L6.4 3.6" stroke="#4fa0ff" stroke-width="1.5"/></svg></span>
            </div>
        </div>

        <!-- Panel 2 (Upgraded Wood Panel) -->
        <div class="bet-card">
            <div class="bet-interface">
                <div class="controls-col">
                    <div class="wager-stepper">
                        <button onclick="changeAmt(2, -0.05)">-</button>
                        <input type="number" id="amt-2" value="0.05" step="0.01">
                        <button onclick="changeAmt(2, 0.05)">+</button>
                    </div>
                    <div class="quick-wager-tokens">
                        <button class="token-btn" onclick="setPreset(2, 1)">1</button>
                        <button class="token-btn" onclick="setPreset(2, 10)">10</button>
                        <button class="token-btn" onclick="setPreset(2, 25)">25</button>
                        <button class="token-btn" onclick="setPreset(2, 50)">50</button>
                    </div>
                </div>
                <button class="bet-submit-btn" id="btn-2" onclick="handleBet(2)">
                    BET
                    <span id="label-2">0.05 FUN</span>
                </button>
            </div>
            <div class="options-row">
                <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                <span>Auto Cashout</span>
                <span>Auto Bet <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1V3M5 9V7M1 5H3M9 5H7M2.2 2.2L3.6 3.6M7.8 7.8L6.4 6.4M2.2 7.8L3.6 6.4M7.8 2.2L6.4 3.6" stroke="#4fa0ff" stroke-width="1.5"/></svg></span>
            </div>
        </div>

    </div>
</div>

<script>
    // System Variables
    let currentBalance = 500000.00;
    let currentMultiplier = 1.00;
    let targetedCrashPoint = 0;
    let isFlightPhase = false;
    let flightEngineInterval = null;

    // Panel states
    let panels = {
        1: { activeWager: 0, status: 'idle' }, // idle, waiting, in-flight
        2: { activeWager: 0, status: 'idle' }
    };

    const multDisplay = document.getElementById('flight-mult');
    const planeObject = document.getElementById('the-plane');
    const balanceDisplay = document.getElementById('wallet-amt');

    function updateBalanceDisplay() {
        balanceDisplay.textContent = currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " FUN";
    }

    function setPreset(p, val) { 
        if(panels[p].status !== 'idle') return;
        document.getElementById('amt-'+p).value = val.toFixed(2); 
        updateLabels(); 
    }
    
    function changeAmt(p, change) {
        if(panels[p].status !== 'idle') return;
        let input = document.getElementById('amt-'+p);
        let finalVal = Math.max(0.01, parseFloat(input.value) + change);
        input.value = finalVal.toFixed(2);
        updateLabels();
    }

    function updateLabels() {
        for(let i=1; i<=2; i++){
            if(panels[i].status === 'idle'){
                let val = parseFloat(document.getElementById('amt-'+i).value);
                document.getElementById('label-'+i).innerText = `${val.toFixed(2)} FUN`;
            }
        }
    }

    function handleBet(p) {
        let state = panels[p];
        let btn = document.getElementById('btn-'+p);
        let currentAmtInput = parseFloat(document.getElementById('amt-'+p).value);

        if (state.status === 'idle') {
            // Place Bet (Waiting for Round)
            if (currentAmtInput > currentBalance || currentAmtInput <= 0) return;
            
            currentBalance -= currentAmtInput;
            updateBalanceDisplay();
            state.activeWager = currentAmtInput;
            state.status = 'waiting';
            btn.style.background = "#2c3e50"; // Dark waiting color
            btn.innerHTML = "WAITING RND<span>Cancel</span>";

            if(!isFlightPhase) {
                // If game isn't running, start a new round automatically
                setTimeout(startNewRound, 1500);
            }

        } else if (state.status === 'waiting') {
            // Cancel pending bet
            currentBalance += state.activeWager;
            updateBalanceDisplay();
            state.status = 'idle';
            state.activeWager = 0;
            btn.style.background = "var(--luxury-green)";
            btn.innerHTML = `BET<span>${currentAmtInput.toFixed(2)} FUN</span>`;

        } else if (state.status === 'in-flight') {
            // CASH OUT
            let winnings = state.activeWager * currentMultiplier;
            currentBalance += winnings;
            updateBalanceDisplay();
            state.status = 'idle';
            state.activeWager = 0;
            btn.style.background = "#e67e22"; // Orange won color
            btn.innerHTML = `WON<span>+${winnings.toFixed(2)}</span>`;
            // lock panel input
            setTimeout(() => {
                 if(panels[p].status === 'idle') {
                    btn.style.background = "var(--luxury-green)";
                    btn.innerHTML = `BET<span>${currentAmtInput.toFixed(2)} FUN</span>`;
                 }
            }, 2000);
        }
    }

    function startNewRound() {
        isFlightPhase = true;
        currentMultiplier = 1.00;
        multDisplay.textContent = "1.00x";
        multDisplay.className = "multiplier-text";
        planeObject.style.opacity = "1";
        
        // simple simulation crash logic
        targetedCrashPoint = generateSecureCrash();

        let startTime = Date.now();

        // Lock existing wait bets into the active round
        for(let i=1; i<=2; i++){
            if(panels[i].status === 'waiting') {
                panels[i].status = 'in-flight';
                let btn = document.getElementById('btn-'+i);
                btn.style.background = "#d35400"; // Deep orange cashout
                btn.innerHTML = `CASH OUT<span>0.00 FUN</span>`;
            } else if (panels[i].status === 'idle') {
                document.getElementById('btn-'+i).disabled = true; // prevent late join
            }
        }

        flightEngineInterval = setInterval(() => {
            let elapsedSec = (Date.now() - startTime) / 1000;
            currentMultiplier = parseFloat(Math.pow(1.10, elapsedSec).toFixed(2));
            multDisplay.textContent = currentMultiplier.toFixed(2) + "x";

            // Control Plane Flight Path (Simulating image flight curve)
            let xPos = Math.min(elapsedSec * 35, 260); // moves right
            let yPos = Math.min(elapsedSec * -16, -140); // moves up (negative translate)
            planeObject.style.transform = `translate(${xPos}px, ${yPos}px)`;

            // Update in-flight potential winnings labels
            for(let i=1; i<=2; i++){
                if(panels[i].status === 'in-flight') {
                    let potentialWin = panels[i].activeWager * currentMultiplier;
                    document.getElementById('label-'+i).innerText = `${potentialWin.toFixed(2)} FUN`;
                }
            }

            if (currentMultiplier >= targetedCrashPoint) {
                executeCrashSequence();
            }
        }, 50);
    }

    function executeCrashSequence() {
        clearInterval(flightEngineInterval);
        isFlightPhase = false;
        multDisplay.textContent = "FLEW AWAY!";
        multDisplay.className = "multiplier-text crashed";
        planeObject.style.opacity = "0";

        // Reset and clear panels
        for(let i=1; i<=2; i++){
            panels[i].activeWager = 0;
            panels[i].status = 'idle';
            let btn = document.getElementById('btn-'+i);
            btn.disabled = false;
            btn.style.background = "var(--luxury-green)";
            btn.innerHTML = `BET<span id="label-${i}">${parseFloat(document.getElementById('amt-'+i).value).toFixed(2)} FUN</span>`;
        }

        // Standard countdown before new round simulation
        setTimeout(startNewRound, 5000);
    }

    // Mathematical inversion creates rare massive multipliers, frequent low ones.
    function generateSecureCrash() {
        let rand = Math.random();
        if (rand < 0.05) return 1.00; // House instant loss (1.00x) cutoff
        return parseFloat((97 / (100 - Math.random() * 100)).toFixed(2));
    }
</script>

</body>
</html>
