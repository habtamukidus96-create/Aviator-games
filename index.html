<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Addis Bet Game Client</title>
    <!-- Tailwind CSS for high-fidelity UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern aesthetic styling mimicking active platform states */
        .game-canvas-bg {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090514 100%);
        }
        .glow-green:focus {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }
        /* Custom scrollbar matching dark mode themes */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-[#0b0c14] text-slate-200 font-sans min-h-screen flex flex-col select-none antialiased">

    <!-- Sticky Main App Header -->
    <header class="bg-[#121424] border-b border-slate-800/80 px-3 py-2 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 text-slate-950 font-black px-2 py-1 rounded text-xs tracking-tighter uppercase">
                ADDIS
            </div>
            <span class="text-xs font-bold text-slate-400 tracking-wider">GAME HUB</span>
        </div>
        
        <!-- Live Wallet Info & Profile Control Panel -->
        <div class="flex items-center space-x-2">
            <div class="bg-[#090a0f] border border-slate-800 rounded px-2.5 py-1 flex items-center space-x-1.5">
                <span class="text-[10px] text-slate-500 font-bold">ETB</span>
                <span id="wallet-display" class="text-xs font-mono font-black text-emerald-400">1,250.00</span>
            </div>
            <div class="w-7 h-7 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-between overflow-hidden">
                <span class="text-[10px] font-bold mx-auto text-slate-400">U1</span>
            </div>
        </div>
    </header>

    <!-- Multiplier History Top Ribbon Bar -->
    <div class="bg-[#090a10] border-b border-slate-900 px-2 py-1.5 flex items-center space-x-1.5 overflow-x-auto whitespace-nowrap z-40">
        <span class="bg-[#16192e] text-emerald-400 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-emerald-950">1.82x</span>
        <span class="bg-[#16192e] text-purple-400 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-purple-950">12.40x</span>
        <span class="bg-[#16192e] text-blue-400 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-blue-950">2.15x</span>
        <span class="bg-[#16192e] text-rose-500 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-rose-950">1.02x</span>
        <span class="bg-[#16192e] text-emerald-400 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-emerald-950">3.50x</span>
        <span class="bg-[#16192e] text-emerald-400 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-emerald-950">1.99x</span>
        <span class="bg-[#16192e] text-amber-500 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border border-amber-950">5.00x</span>
    </div>

    <!-- Main Mobile Responsive Workboard View -->
    <main class="flex-1 flex flex-col p-2 space-y-2 max-w-md mx-auto w-full">
        
        <!-- Live Graph Simulator Node Canvas Container -->
        <section class="game-canvas-bg border border-slate-800/60 rounded-xl h-48 relative flex flex-col justify-center items-center overflow-hidden shadow-inner">
            
            <!-- Absolute Positioning Layout Indicators -->
            <div class="absolute top-2 left-3 bg-black/40 backdrop-blur-xs text-[10px] px-1.5 py-0.5 rounded text-slate-400 font-mono flex items-center space-x-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                <span>LIVE SESSION</span>
            </div>

            <!-- Central Multiplier Presentation Text Node -->
            <div class="text-center z-10 transition-all duration-75">
                <div id="canvas-ticker" class="text-5xl font-black font-mono tracking-tight text-slate-100">1.00x</div>
                <div id="canvas-status" class="text-[9px] text-slate-500 tracking-widest uppercase mt-1 font-bold">Waiting for next round</div>
            </div>

            <!-- Vector Line Graph Path Overlay Simulating Flight Curves -->
            <svg class="absolute bottom-0 left-0 w-full h-full pointer-events-none" viewBox="0 0 400 200">
                <path id="graph-curve" d="M 0 200 Q 150 200 400 200" fill="none" stroke="#f59e0b" stroke-width="3" class="transition-all duration-100"/>
            </svg>
        </section>

        <!-- Dynamic Control Switch Tabs (Single Bet vs Dual Split Layout) -->
        <div class="grid grid-cols-2 bg-[#121424] rounded-lg p-1 border border-slate-800/40 text-xs font-bold text-center">
            <button id="tab-single" onclick="switchBetMode('single')" class="py-1.5 rounded bg-[#1c1e36] text-amber-400 shadow-xs">Single Bet</button>
            <button id="tab-double" onclick="switchBetMode('double')" class="py-1.5 rounded text-slate-400 hover:text-slate-200">Auto Panel</button>
        </div>

        <!-- Bet Processing Form Card Block -->
        <section class="bg-[#121424] border border-slate-800/80 rounded-xl p-3 space-y-3 shadow-lg">
            
            <!-- Quick Stake Increment Switch Grid -->
            <div class="grid grid-cols-4 gap-1">
                <button onclick="setQuickStake(50)" class="bg-[#191c33] hover:bg-[#202442] active:bg-slate-900 text-xs font-mono py-1.5 rounded font-bold text-slate-300 border border-slate-800/30">50</button>
                <button onclick="setQuickStake(100)" class="bg-[#191c33] hover:bg-[#202442] active:bg-slate-900 text-xs font-mono py-1.5 rounded font-bold text-slate-300 border border-slate-800/30">100</button>
                <button onclick="setQuickStake(200)" class="bg-[#191c33] hover:bg-[#202442] active:bg-slate-900 text-xs font-mono py-1.5 rounded font-bold text-slate-300 border border-slate-800/30">200</button>
                <button onclick="setQuickStake(500)" class="bg-[#191c33] hover:bg-[#202442] active:bg-slate-900 text-xs font-mono py-1.5 rounded font-bold text-slate-300 border border-slate-800/30">500</button>
            </div>

            <!-- Value Parameter Input Modifiers -->
            <div class="space-y-2">
                <div class="bg-[#090a10] border border-slate-800/80 rounded-lg p-2 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[9px] text-slate-500 font-bold uppercase">BET AMOUNT</span>
                        <input type="number" id="input-stake" value="100" class="bg-transparent text-amber-400 font-mono font-black text-lg focus:outline-none w-24">
                    </div>
                    <div class="flex space-x-1">
                        <button onclick="multiplyStake(0.5)" class="bg-[#16182c] text-slate-400 font-mono px-2 py-1 text-xs rounded border border-slate-800 font-bold">½</button>
                        <button onclick="multiplyStake(2)" class="bg-[#16182c] text-slate-400 font-mono px-2 py-1 text-xs rounded border border-slate-800 font-bold">2x</button>
                    </div>
                </div>

                <div class="bg-[#090a10] border border-slate-800/80 rounded-lg p-2 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[9px] text-slate-500 font-bold uppercase">AUTO CASHOUT MULTIPLIER</span>
                        <input type="number" id="input-cashout" value="2.00" step="0.10" class="bg-transparent text-purple-400 font-mono font-black text-base focus:outline-none w-24">
                    </div>
                    <span class="text-[10px] text-slate-600 font-mono font-bold pr-1">PROVABLY FAIR</span>
                </div>
            </div>

            <!-- Giant Colored Core Action Execution Button Trigger -->
            <button id="core-action-trigger" onclick="handleActionCycle()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] transition-all text-slate-950 font-black text-center py-3.5 rounded-xl uppercase tracking-wider text-base shadow-lg shadow-emerald-950/20 glow-green">
                Place Bet
            </button>
        </section>

        <!-- Real-time Active Leaderboard / Feed Tab Section -->
        <section class="bg-[#121424] border border-slate-800/80 rounded-xl flex-1 flex flex-col overflow-hidden min-h-[160px]">
            <div class="px-3 py-2 border-b border-slate-800 flex justify-between items-center bg-[#0d0f1a]">
                <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">Live Active Bets</span>
                <span class="bg-[#191b30] text-emerald-400 text-[9px] font-mono font-bold px-2 py-0.5 rounded" id="live-count-badge">84 Players</span>
            </div>

            <!-- Feed Log Data Loop Output -->
            <div class="p-1 overflow-y-auto space-y-1 text-[11px] font-mono flex-1 bg-[#090a0f]/40">
                <div class="flex justify-between items-center p-2 bg-[#0d0f1c]/60 rounded border border-slate-900">
                    <span class="text-slate-400 font-sans">User_ethio99</span>
                    <span class="text-slate-300 font-bold">150 ETB</span>
                    <span class="text-emerald-400 font-bold">1.45x</span>
                    <span class="text-emerald-500 font-black">+217.50</span>
                </div>
                <div class="flex justify-between items-center p-2 bg-[#0d0f1c]/60 rounded border border-slate-900">
                    <span class="text-slate-400 font-sans">Abebe_K</span>
                    <span class="text-slate-300 font-bold">500 ETB</span>
                    <span class="text-slate-600">--</span>
                    <span class="text-amber-500 animate-pulse font-bold">In Play</span>
                </div>
                <div class="flex justify-between items-center p-2 bg-[#0d0f1c]/60 rounded border border-slate-900 opacity-50">
                    <span class="text-slate-400 font-sans">Solomon_Bet</span>
                    <span class="text-slate-300 font-bold">1,000 ETB</span>
                    <span class="text-rose-500">Crashed</span>
                    <span class="text-rose-500">0.00</span>
                </div>
            </div>
        </section>
    </main>

    <!-- UI Interaction State Script Controller -->
    <script>
        let gameState = 'idle'; // Options: 'idle' | 'running' | 'cashed_out' | 'crashed'
        let currentLoopMultiplier = 1.00;
        let runningInterval;
        let accountBalance = 1250.00;

        function handleActionCycle() {
            const btn = document.getElementById('core-action-trigger');
            const ticker = document.getElementById('canvas-ticker');
            const status = document.getElementById('canvas-status');
            const stakeInput = document.getElementById('input-stake');
            const balanceDisplay = document.getElementById('wallet-display');
            const curve = document.getElementById('graph-curve');

            let betValue = parseFloat(stakeInput.value) || 0;

            if (gameState === 'idle') {
                if (betValue > accountBalance) {
                    alert("Insufficient balance for this operation.");
                    return;
                }

                // Deduct Balance and initialize layout state
                accountBalance -= betValue;
                balanceDisplay.innerText = accountBalance.toFixed(2);

                gameState = 'running';
                currentLoopMultiplier = 1.00;
                ticker.innerText = "1.00x";
                ticker.className = "text-5xl font-black font-mono tracking-tight text-emerald-400";
                status.innerText = "GROWING MULTIPLIER...";
                
                btn.innerText = "CASH OUT";
                btn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-center py-3.5 rounded-xl uppercase tracking-wider text-base shadow-lg";

                // Begin Mathematical Engine Loop Execution
                runningInterval = setInterval(() => {
                    currentLoopMultiplier += (0.01 + (currentLoopMultiplier * 0.003));
                    ticker.innerText = currentLoopMultiplier.toFixed(2) + "x";

                    // Dynamically animate the vector line curve path coordinates based on the multiplier
                    let progressX = Math.min(400, 50 + (currentLoopMultiplier * 60));
                    let progressY = Math.max(40, 200 - (currentLoopMultiplier * 25));
                    curve.setAttribute('d', `M 0 200 Q ${progressX / 2} 200 ${progressX} ${progressY}`);

                    // Read Auto Cashout Limit Parameter
                    let autoLimit = parseFloat(document.getElementById('input-cashout').value) || 999;
                    if (currentLoopMultiplier >= autoLimit) {
                        triggerManualCashout();
                    }

                    // Generate a random probability distribution trigger to calculate crashes
                    if (Math.random() < 0.012 && currentLoopMultiplier > 1.15) {
                        triggerSystemCrash();
                    }
                }, 70);

            } else if (gameState === 'running') {
                triggerManualCashout();
            } else {
                // Reset platform state back to configuration mode
                gameState = 'idle';
                ticker.className = "text-5xl font-black font-mono tracking-tight text-slate-100";
                ticker.innerText = "1.00x";
                status.innerText = "Waiting for next round";
                curve.setAttribute('d', "M 0 200 Q 150 200 400 200");
                btn.innerText = "Place Bet";
                btn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-center py-3.5 rounded-xl uppercase tracking-wider text-base shadow-lg glow-green";
            }
        }

        function triggerManualCashout() {
            clearInterval(runningInterval);
            gameState = 'cashed_out';
            const btn = document.getElementById('core-action-trigger');
            const status = document.getElementById('canvas-status');
            const stakeInput = document.getElementById('input-stake');
            const balanceDisplay = document.getElementById('wallet-display');

            let betValue = parseFloat(stakeInput.value) || 0;
            let winAmount = betValue * currentLoopMultiplier;
            accountBalance += winAmount;
            balanceDisplay.innerText = accountBalance.toFixed(2);

            status.innerHTML = `<span class="text-emerald-400 font-bold">WON +${winAmount.toFixed(2)} ETB</span>`;
            btn.innerText = "PREPARE NEXT ROUND";
            btn.className = "w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-black text-center py-3.5 rounded-xl uppercase tracking-wider text-base shadow-lg";
        }

        function triggerSystemCrash() {
            clearInterval(runningInterval);
            gameState = 'crashed';
            const btn = document.getElementById('core-action-trigger');
            const ticker = document.getElementById('canvas-ticker');
            const status = document.getElementById('canvas-status');

            ticker.className = "text-5xl font-black font-mono tracking-tight text-rose-500";
            status.innerHTML = `<span class="text-rose-500 font-bold">FLEW AWAY AT ${currentLoopMultiplier.toFixed(2)}x</span>`;
            
            btn.innerText = "PREPARE NEXT ROUND";
            btn.className = "w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-black text-center py-3.5 rounded-xl uppercase tracking-wider text-base shadow-lg";
        }

        function setQuickStake(val) {
            if (gameState !== 'running') {
                document.getElementById('input-stake').value = val;
            }
        }

        function multiplyStake(factor) {
            if (gameState !== 'running') {
                let el = document.getElementById('input-stake');
                el.value = Math.max(10, Math.floor(parseFloat(el.value || 0) * factor));
            }
        }

        function switchBetMode(mode) {
            const singleBtn = document.getElementById('tab-single');
            const doubleBtn = document.getElementById('tab-double');
            if (mode === 'single') {
                singleBtn.className = "py-1.5 rounded bg-[#1c1e36] text-amber-400 shadow-xs";
                doubleBtn.className = "py-1.5 rounded text-slate-400 hover:text-slate-200";
            } else {
                doubleBtn.className = "py-1.5 rounded bg-[#1c1e36] text-amber-400 shadow-xs";
                singleBtn.className = "py-1.5 rounded text-slate-400 hover:text-slate-200";
            }
        }
    </script>
</body>
</html>
